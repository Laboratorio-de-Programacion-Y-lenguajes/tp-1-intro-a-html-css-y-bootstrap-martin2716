<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Fondo gradiente -->
  <defs>
    <linearGradient id="bgThreats" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d26;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12051e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowThreats" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(212,0,170,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(212,0,170,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgThreats)"/>
  <rect width="400" height="300" fill="url(#glowThreats)"/>
  
  <!-- Grid subtle -->
  <defs>
    <pattern id="gridThreat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(180,0,180,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#gridThreat)" />
  
  <!-- Escudo protector (centro) -->
  <g transform="translate(200, 150)">
    <!-- Escudo grande -->
    <path d="M -50 -45 L 0 -65 L 50 -45 L 50 30 Q 0 70 0 70 Q 0 70 -50 30 Z" 
          fill="none" stroke="#b400b4" stroke-width="2.5" opacity="0.7"/>
    
    <!-- Relleno degradado interno sutil -->
    <path d="M -50 -45 L 0 -65 L 50 -45 L 50 30 Q 0 70 0 70 Q 0 70 -50 30 Z" 
          fill="#b400b4" opacity="0.08"/>
    
    <!-- Líneas internas del escudo -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#b400b4" stroke-width="1" opacity="0.3"/>
    <line x1="-30" y1="10" x2="30" y2="10" stroke="#b400b4" stroke-width="1" opacity="0.3"/>
    
    <!-- Símbolo de protección en el centro -->
    <g transform="translate(0, 15)">
      <!-- Triángulo de alerta pero como protección -->
      <path d="M 0 -18 L 12 8 L -12 8 Z" 
            fill="none" stroke="#b400b4" stroke-width="2" opacity="0.8"/>
      <!-- Punto en el centro (ojo) -->
      <circle cx="0" cy="0" r="2.5" fill="#b400b4" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Amenaza izquierda (virus/attack) -->
  <g transform="translate(80, 130)" opacity="0.5">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#b400b4" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#b400b4" stroke-width="1" opacity="0.3"/>
    <!-- Púas -->
    <line x1="0" y1="-15" x2="0" y2="-20" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
    <line x1="10.6" y1="-10.6" x2="15" y2="-15" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
    <line x1="15" y1="0" x2="20" y2="0" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Amenaza derecha -->
  <g transform="translate(320, 150)" opacity="0.5">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#b400b4" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#b400b4" stroke-width="1" opacity="0.3"/>
    <!-- Púas -->
    <line x1="0" y1="15" x2="0" y2="20" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
    <line x1="-10.6" y1="10.6" x2="-15" y2="15" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
    <line x1="-15" y1="0" x2="-20" y2="0" stroke="#b400b4" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Flechas de protección (escudo bloqueando) -->
  <g opacity="0.4">
    <path d="M 140 150 L 160 150" stroke="#b400b4" stroke-width="1.5" fill="none"/>
    <path d="M 240 150 L 260 150" stroke="#b400b4" stroke-width="1.5" fill="none"/>
  </g>
  
  <!-- Check marks (protección activa) -->
  <g transform="translate(170, 120)" opacity="0.6">
    <path d="M 0 0 L 3 3 L 8 -2" stroke="#b400b4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(230, 170)" opacity="0.6">
    <path d="M 0 0 L 3 3 L 8 -2" stroke="#b400b4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>