<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Fondo gradiente -->
  <defs>
    <linearGradient id="bgCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowCyber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,212,170,0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,212,170,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgCyber)"/>
  <rect width="400" height="300" fill="url(#glowCyber)"/>
  
  <!-- Grid subtle -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,212,170,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#grid)" />
  
  <!-- Escudo con candado (símbolo de ciberseguridad) -->
  <g transform="translate(200, 150)">
    <!-- Escudo -->
    <path d="M -50 -40 L 0 -60 L 50 -40 L 50 20 Q 0 60 0 60 Q 0 60 -50 20 Z" 
          fill="none" stroke="#00d4aa" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Líneas decorativas en escudo -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#00d4aa" stroke-width="1.5" opacity="0.4"/>
    <line x1="-25" y1="5" x2="25" y2="5" stroke="#00d4aa" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Candado dentro -->
    <g transform="translate(0, 10)">
      <!-- Cuerpo del candado -->
      <rect x="-15" y="10" width="30" height="25" rx="2" 
            fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.9"/>
      <!-- Arco superior -->
      <path d="M -10 10 Q -10 -5 0 -8 Q 10 -5 10 10" 
            fill="none" stroke="#00d4aa" stroke-width="2" opacity="0.9"/>
      <!-- Punto en el centro (llave) -->
      <circle cx="0" cy="22" r="2.5" fill="#00d4aa" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Puntos flotantes (data/conexiones) -->
  <circle cx="80" cy="60" r="3" fill="#00d4aa" opacity="0.5"/>
  <circle cx="320" cy="80" r="2.5" fill="#00d4aa" opacity="0.4"/>
  <circle cx="100" cy="240" r="2" fill="#00d4aa" opacity="0.3"/>
  <circle cx="300" cy="220" r="3.5" fill="#00d4aa" opacity="0.4"/>
  
  <!-- Líneas de conexión -->
  <line x1="80" y1="60" x2="150" y2="140" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
  <line x1="320" y1="80" x2="250" y2="140" stroke="#00d4aa" stroke-width="1" opacity="0.2"/>
</svg>